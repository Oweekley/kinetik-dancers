<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="kinetik-interest" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="kinetik-interest" />
      <input name="bot-field" />
      <input name="guardian-name" type="text" />
      <input name="dancer-name" type="text" />
      <input name="dancer-age" type="number" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <select name="class-interest">
        <option>Mini Movers</option>
        <option>Junior Dance</option>
        <option>Street + Commercial</option>
      </select>
      <textarea name="message"></textarea>
      <input name="media-consent-info" type="checkbox" />
    </form>
  </body>
</html>
